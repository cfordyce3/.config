# Color settings
set -a terminal-features "tmux-256color:RGB"

# Prefix is ctrl-space
set -g prefix C-SPACE


set -g base-index 1 # start window list at 1
set -g renumber-windows on # not sure
set -g mode-keys vi # copy mode uses vi bindings
set -g status-position top # bar on top
set -g status-justify absolute-centre # centers windows
set -g status-style "bg=default" # top bar no bg color
set -g window-status-current-style "fg=blue bold" # current window is bolded
set -g status-right "" # nothing on right side
set -g status-left "#S" # window name on left

set -g mouse on
set -g set-clipboard on

# general binds

# renaming
unbind r
unbind R
bind r command-prompt -I "#W" "rename-window '%%'"
bind R command-prompt -I "#W" "rename-session '%%'"
bind C-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-style pane resizing
bind -r H resize-pane -L
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R

# Split windows
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
